[project]
name = "devtunnel"
version = "0.0.2"
description = "Cross-platform CLI that sets up both ends of a tailcat SSH tunnel -- no account, no elevation -- and fully reverses itself on uninstall."
readme = "README.md"
authors = [
    { name = "Tommy Smith", email = "tommy.smith@skillable.com" }
]
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.7",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
]

[project.scripts]
devtunnel = "devtunnel.cli.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/devtunnel"]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# Typer's documented pattern is `param: T = typer.Option(...)` as the default
# value itself -- bugbear's "no function calls in defaults" check doesn't know
# that Typer inspects the default at import time, not per-call.
"src/devtunnel/cli/app.py" = ["B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
